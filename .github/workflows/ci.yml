name: CI

on:
  push:
    branches: [main, "dev_*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check benchmark/

      - name: Mypy type-check
        run: mypy benchmark/ --ignore-missing-imports

  smoke:
    name: Smoke test (CPU, tiny dataset)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -e .

      - name: Run smoke benchmark
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -m benchmark.main \
            --task image_classification \
            --dataset cifar10 \
            --model cnn_scratch \
            --optimizers adam \
            --epochs 1 \
            --batch-size 32 \
            --max-samples 64 \
            --num-workers 0 \
            --output-dir ./results
